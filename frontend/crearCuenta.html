<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Café Ágape, cafetería en Resistencia con café de especialidad, desayunos y meriendas artesanales en un ambiente cálido y acogedor.">
    <meta name="author" content="Café Ágape">
    <meta http-equiv="Content-Language" content="es">
    <title>Café Ágape | Inicio de Sesion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/inicioSesion.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <nav class="navbar shadow">
            <div class="container-fluid justify-content-center">
                <span id="brand" class="navbar-brand">
                    CAFE AGAPE
                </span>
            </div>
        </nav>
    </header>
    <main class="main-login">
        <div class="container">

            <button onclick="history.back()" class="btn btn-primary p-2 px-4 mt-4 mb-4">Volver</button>

            <div id="contenidoPrincipal" class="d-flex mb-5 justify-content-center align-items-center">

                <div class="card p-4 shadow login-card">

                    <h3 class="text-center mb-4">Crear cuenta</h3>

                    <form action="index.html">
                        <div class="mb-3">
                            <label for="text" class="form-label">Nombre de usuario</label>
                            <input type="text" class="form-control" id="text" maxlength="50" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="email" placeholder="ejemplo@mail.com"
                                minlength="10" maxlength="50" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password" placeholder="minimo 8 caracteres"
                                minlength="8" maxlength="50" required>
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="remember">
                            <label class="form-check-label" for="remember">Recordarme</label>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Crear cuenta
                        </button>
                    </form>

                </div>

            </div>
        </div>
    </main>
    <footer>

    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous">
        </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous">
        </script>
</body>

</html>
